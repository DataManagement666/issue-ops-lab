name: Issue Dashboard

on:
  # Issue Ops 用 GITHUB_TOKEN 改标签时不会触发 issues 事件；
  # 用 workflow_run 在它结束后补一次刷新，避免看板停留在旧状态。
  workflow_run:
    workflows: ["Issue Ops"]
    types: [completed]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned, unassigned]
  schedule:
    # 每小时刷新一次；数据没变时不会产生 commit。
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: issue-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        run: node scripts/build-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          DASHBOARD_TITLE: "Issue Ops Lab — 状态看板"
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "chore: update issue dashboard [skip ci]"
          git push
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-dashboard
          path: dashboard
          retention-days: 14
      - name: Configure Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
