name: Issue Ops

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  schedule:
    # 每天一次超期提醒；错开整点，避免与其它定时任务撞车。
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-ops-${{ github.event.issue.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  ops:
    # Bot 自己造成的 label/close/reopen 事件不再触发，避免自激循环。
    if: github.event_name != 'issues' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run issue state machine
        run: node scripts/issue-ops.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
